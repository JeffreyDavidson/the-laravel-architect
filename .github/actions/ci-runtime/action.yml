name: CI runtime
description: Prepare isolated locked dependencies and application fixtures for a CI lane.
inputs:
  composer-username:
    required: true
    description: Private Composer repository username
  composer-password:
    required: true
    description: Private Composer repository password
  composer-auth:
    required: true
    description: Composer authentication JSON
runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: '8.5'
        extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, iconv, intl, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml, zip
        coverage: none
    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22'
        cache: npm
    - name: Validate Composer configuration
      shell: bash
      run: composer validate --strict --no-check-publish
    - name: Install PHP dependencies
      shell: bash
      env:
        COMPOSER_USERNAME: ${{ inputs.composer-username }}
        COMPOSER_PASSWORD: ${{ inputs.composer-password }}
        COMPOSER_AUTH: ${{ inputs.composer-auth }}
      run: |
        composer config --global --auth http-basic.satis.filamentexamples.com "$COMPOSER_USERNAME" "$COMPOSER_PASSWORD"
        composer install --no-interaction --prefer-dist --no-progress
    - name: Install Node dependencies
      shell: bash
      run: npm ci
    - name: Prepare application
      shell: bash
      run: |
        cp .env.example .env
        php artisan key:generate --ansi
        php artisan config:clear --ansi
        touch database/database.sqlite
        php artisan migrate --force --seed
        php artisan content:import-public tests/Browser/fixtures/public-content.json
        php artisan storage:link --relative --force
    - name: Build assets
      shell: bash
      run: npm run build
