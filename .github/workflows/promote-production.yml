name: Promote production
run-name: Promote ${{ inputs.revision }} from staging run ${{ inputs.staging_run_id }} attempt ${{ inputs.staging_run_attempt }}

on:
    workflow_dispatch:
        inputs:
            revision:
                description: Full 40-character SHA reviewed on staging
                required: true
                type: string
            staging_run_id:
                description: Successful Deploy staging workflow run ID for that SHA
                required: true
                type: string
            staging_run_attempt:
                description: Successful staging attempt reviewed for that SHA
                required: true
                type: string

permissions:
    contents: read
    actions: read
    deployments: write

jobs:
    production:
        if: github.ref == 'refs/heads/main' && vars.STAGED_RELEASES_ENABLED == 'true'
        name: Approve production ${{ inputs.revision }}
        # Job-level, so a skipped dispatch never enters the group shared with staging.
        concurrency:
            group: release-promotion
            cancel-in-progress: false
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        environment: production
        env:
            EXPECTED_REVISION: ${{ inputs.revision }}
            STAGING_RUN_ID: ${{ inputs.staging_run_id }}
            STAGING_RUN_ATTEMPT: ${{ inputs.staging_run_attempt }}
        steps:
            - name: Validate the successful staging run
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
                  [[ "$STAGING_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                  [[ "$STAGING_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
                  validate_staging_run() {
                    jq --slurp -e --arg sha "$EXPECTED_REVISION" --arg repo "$GITHUB_REPOSITORY" \
                      --arg id "$STAGING_RUN_ID" --arg attempt "$STAGING_RUN_ATTEMPT" '
                        length == 1 and (.[0] |
                          (.id | type == "number") and (.id | tostring) == $id and
                            (.run_attempt | type == "number") and (.run_attempt | tostring) == $attempt and
                          .conclusion == "success" and .status == "completed" and
                          .event == "workflow_run" and .head_branch == "main" and
                          .head_sha == $sha and .head_repository.full_name == $repo and
                          .path == ".github/workflows/deploy-staging.yml")'
                  }
                  # A preceding success cannot satisfy a retry that has not registered yet.
                  gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID/attempts/$STAGING_RUN_ATTEMPT" |
                    validate_staging_run
                  # Require the deployment job from the reviewed attempt, including later pages.
                  gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID/attempts/$STAGING_RUN_ATTEMPT/jobs" --paginate --slurp |
                    jq --slurp -e --arg name "Stage $EXPECTED_REVISION" --arg id "$STAGING_RUN_ID" --arg attempt "$STAGING_RUN_ATTEMPT" '
                      length == 1 and (.[0] |
                        type == "array" and length > 0 and all(.[]; (.jobs | type) == "array") and
                        any(.[] | .jobs[];
                          (.run_id | type == "number") and (.run_id | tostring) == $id and
                          (.run_attempt | type == "number") and (.run_attempt | tostring) == $attempt and
                          .name == $name and .status == "completed" and .conclusion == "success"))'
                  # Reject a selected attempt superseded while evidence was being read.
                  gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" |
                    validate_staging_run
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ inputs.revision }}
                  fetch-depth: 0
            - name: Verify reviewed main ancestry
              run: |
                  test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
                  git fetch origin main
                  git merge-base --is-ancestor "$EXPECTED_REVISION" origin/main
            - uses: ./.github/actions/deployment-runtime
              with:
                  composer-username: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_USERNAME }}
                  composer-password: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_PASSWORD }}
                  composer-auth: ${{ secrets.COMPOSER_AUTH }}
            - name: Recheck staging and deploy the approved production revision
              env:
                  FORGE_DEPLOY_HOOK: ${{ secrets.FORGE_DEPLOY_HOOK }}
                  CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
                  CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
              run: node scripts/forge-deployment.mjs deploy production "$EXPECTED_REVISION"
            - name: Run production smoke checks
              env:
                  PRODUCTION_BASE_URL: https://thelaravelarchitect.com
              run: |
                  # The smoke tests boot the test app, which reads .env. An empty file avoids a
                  # missing-file warning; configuration still comes from phpunit.xml and this step.
                  touch .env
                  vendor/bin/pest tests/Feature/Http/ProductionSmokeTest.php --group=production --compact --display-warnings --display-deprecations
            - name: Recheck the serving production revision
              run: |
                  node scripts/forge-deployment.mjs verify production "$EXPECTED_REVISION"
                  printf 'Production verified: `%s`. Record the immutable release tag and deployment result.\n' "$EXPECTED_REVISION" >> "$GITHUB_STEP_SUMMARY"
