name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, iconv, intl, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Configure private Composer repository
        env:
          FILAMENTEXAMPLES_COMPOSER_USERNAME: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_USERNAME }}
          FILAMENTEXAMPLES_COMPOSER_PASSWORD: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_PASSWORD }}
        run: composer config --global --auth http-basic.satis.filamentexamples.com "$FILAMENTEXAMPLES_COMPOSER_USERNAME" "$FILAMENTEXAMPLES_COMPOSER_PASSWORD"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Test deployment safeguards
        run: npm run test:deployment

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Audit production JavaScript dependencies
        run: |
          for attempt in 1 2 3; do
            if npx --yes npm@11 audit --omit=dev; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done

          exit 1

      # Development-only JavaScript advisories are reported by the daily
      # Dependency audit workflow instead of failing unrelated pull requests.

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan config:clear --ansi
          touch database/database.sqlite
          php artisan migrate --force --seed
          php artisan content:import-public tests/Browser/fixtures/public-content.json
          php artisan storage:link --relative --force

      - name: Check code style
        run: composer test:lint

      - name: Check method chains
        run: php scripts/check-method-chaining.php

      - name: Run static analysis
        run: composer test:types

      - name: Run test static analysis
        run: composer test:types:pest

      - name: Check Rector rules
        run: composer test:rector && composer test:rector:pest

      - name: Check Filament code quality
        run: composer test:filament

      - name: Build assets
        run: npm run build

      - name: Check asset budgets
        run: npm run test:assets

      - name: Check frontend formatting
        run: npm run format:check

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # apt-get update once hung for 14 minutes in CI, so each attempt is capped and retried once.
      # A cache hit skips the browser download and only installs the system packages.
      - name: Install Playwright browser
        timeout-minutes: 6
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$PLAYWRIGHT_CACHE_HIT" = 'true' ]; then
            set -- install-deps chromium
          else
            set -- install --with-deps chromium
          fi

          for attempt in 1 2; do
            if timeout --kill-after=15s 150s npx playwright "$@"; then
              exit 0
            fi

            echo "::warning::Playwright install attempt $attempt failed or timed out."
          done

          exit 1

      - name: Run non-browser tests in parallel
        run: composer test

      - name: Check type coverage
        run: composer test:type-coverage

      - name: Run browser tests serially
        run: composer test:browser

      - name: Keep browser test screenshots from a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
          retention-days: 7
