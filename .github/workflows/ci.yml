name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, iconv, intl, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Configure private Composer repository
        env:
          FILAMENTEXAMPLES_COMPOSER_USERNAME: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_USERNAME }}
          FILAMENTEXAMPLES_COMPOSER_PASSWORD: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_PASSWORD }}
        run: composer config --global --auth http-basic.satis.filamentexamples.com "$FILAMENTEXAMPLES_COMPOSER_USERNAME" "$FILAMENTEXAMPLES_COMPOSER_PASSWORD"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Test deployment safeguards
        run: npm run test:deployment

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Audit production JavaScript dependencies
        run: |
          for attempt in 1 2 3; do
            if npx --yes npm@11 audit --omit=dev; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done

          exit 1

      - name: Audit JavaScript development dependencies
        run: npx --yes npm@11 audit --include=dev

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan config:clear --ansi
          touch database/database.sqlite
          php artisan migrate --force --seed
          php artisan content:import-public tests/Browser/fixtures/public-content.json
          php artisan storage:link --relative --force

      - name: Check code style
        run: composer lint:check

      - name: Run static analysis
        run: composer test:types

      - name: Run test static analysis
        run: composer test:types:pest

      - name: Check Rector rules
        run: composer test:rector && composer test:rector:pest

      - name: Check Filament code quality
        run: composer test:filament

      - name: Build assets
        run: npm run build

      - name: Check asset budgets
        run: npm run test:assets

      - name: Check frontend formatting
        run: npm run format:check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run non-browser tests in parallel
        run: vendor/bin/pest --parallel --exclude-testsuite Browser

      - name: Run browser tests serially
        run: vendor/bin/pest --testsuite Browser
