name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare CI runtime
        uses: ./.github/actions/ci-runtime
        with:
          composer-username: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_USERNAME }}
          composer-password: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_PASSWORD }}
          composer-auth: ${{ secrets.COMPOSER_AUTH }}

      - name: Test deployment safeguards
        run: npm run test:deployment

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Audit production JavaScript dependencies
        run: |
          for attempt in 1 2 3; do
            if npx --yes npm@11 audit --omit=dev; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done

          exit 1

      # Development-only JavaScript advisories are reported by the daily
      # Dependency audit workflow instead of failing unrelated pull requests.

      - name: Check code style
        run: composer test:lint

      - name: Check method chains
        run: php scripts/check-method-chaining.php

      - name: Restore phpstan-app cache
        id: restore-phpstan-app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage/framework/cache/phpstan-app
          key: ci-v1-phpstan-app-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan-pest.neon', 'tests/*.stub') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-v1-phpstan-app-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan-pest.neon', 'tests/*.stub') }}-

      - name: Check phpstan-app
        id: phpstan-app
        run: composer test:types

      - name: Save phpstan-app cache
        if: ${{ !cancelled() && steps.phpstan-app.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage/framework/cache/phpstan-app
          key: ci-v1-phpstan-app-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan-pest.neon', 'tests/*.stub') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore phpstan-pest cache
        id: restore-phpstan-pest
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage/framework/cache/phpstan-pest
          key: ci-v1-phpstan-pest-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan-pest.neon', 'tests/*.stub') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-v1-phpstan-pest-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan-pest.neon', 'tests/*.stub') }}-

      - name: Check phpstan-pest
        id: phpstan-pest
        run: composer test:types:pest

      - name: Save phpstan-pest cache
        if: ${{ !cancelled() && steps.phpstan-pest.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage/framework/cache/phpstan-pest
          key: ci-v1-phpstan-pest-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock', 'phpstan.neon', 'phpstan-pest.neon', 'tests/*.stub') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore rector-app cache
        id: restore-rector-app
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage/framework/cache/rector-app
          key: ci-v1-rector-app-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock', 'rector.php', 'rector-pest.php') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-v1-rector-app-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock', 'rector.php', 'rector-pest.php') }}-

      - name: Check rector-app
        id: rector-app
        run: composer test:rector

      - name: Save rector-app cache
        if: ${{ !cancelled() && steps.rector-app.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage/framework/cache/rector-app
          key: ci-v1-rector-app-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock', 'rector.php', 'rector-pest.php') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore rector-pest cache
        id: restore-rector-pest
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage/framework/cache/rector-pest
          key: ci-v1-rector-pest-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock', 'rector.php', 'rector-pest.php') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-v1-rector-pest-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock', 'rector.php', 'rector-pest.php') }}-

      - name: Check rector-pest
        id: rector-pest
        run: composer test:rector:pest

      - name: Save rector-pest cache
        if: ${{ !cancelled() && steps.rector-pest.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: storage/framework/cache/rector-pest
          key: ci-v1-rector-pest-${{ runner.os }}-${{ runner.arch }}-php8.5-${{ hashFiles('composer.lock', 'rector.php', 'rector-pest.php') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check Filament code quality
        run: composer test:filament

      - name: Check asset budgets
        run: npm run test:assets

      - name: Check frontend formatting
        run: npm run format:check

  tests:
    name: Application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare CI runtime
        uses: ./.github/actions/ci-runtime
        with:
          composer-username: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_USERNAME }}
          composer-password: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_PASSWORD }}
          composer-auth: ${{ secrets.COMPOSER_AUTH }}

      - name: Run non-browser tests in parallel
        run: composer test

      - name: Check type coverage
        run: composer test:type-coverage

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare CI runtime
        uses: ./.github/actions/ci-runtime
        with:
          composer-username: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_USERNAME }}
          composer-password: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_PASSWORD }}
          composer-auth: ${{ secrets.COMPOSER_AUTH }}

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # apt-get update once hung for 14 minutes in CI, so each attempt is capped and retried once.
      # Killing the timed-out attempt leaves the sudo apt-get it spawned running and holding the dpkg
      # lock, so the retry stops any leftover apt/dpkg processes and waits (bounded) for the lock.
      # A cache hit skips the browser download and only installs the system packages.
      - name: Install Playwright browser
        timeout-minutes: 6
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$PLAYWRIGHT_CACHE_HIT" = 'true' ]; then
            set -- install-deps chromium
          else
            set -- install --with-deps chromium
          fi

          for attempt in 1 2; do
            if timeout --kill-after=15s 150s npx playwright "$@"; then
              exit 0
            fi

            echo "::warning::Playwright install attempt $attempt failed or timed out."

            # The bracketed patterns stop pkill from matching its own sudo command line.
            sudo pkill -KILL -f '[a]pt-get|[d]pkg' || true

            for _ in $(seq 30); do
              sudo fuser -s /var/lib/dpkg/lock-frontend || break
              sleep 1
            done
          done

          exit 1

      - name: Run browser tests serially
        run: composer test:browser

      - name: Keep browser test screenshots from a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
          retention-days: 7

  laravel:
    name: Laravel
    needs: [quality, tests, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Require every CI lane to succeed
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/verify-ci-jobs.mjs
