name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, iconv, intl, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Configure private Composer repository
        env:
          FILAMENTEXAMPLES_COMPOSER_USERNAME: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_USERNAME }}
          FILAMENTEXAMPLES_COMPOSER_PASSWORD: ${{ secrets.FILAMENTEXAMPLES_COMPOSER_PASSWORD }}
        run: composer config --global --auth http-basic.satis.filamentexamples.com "$FILAMENTEXAMPLES_COMPOSER_USERNAME" "$FILAMENTEXAMPLES_COMPOSER_PASSWORD"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan config:clear --ansi
          touch database/database.sqlite
          php artisan migrate --force --seed
          php artisan content:import-public tests/e2e/fixtures/public-content.json

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run static analysis
        run: composer test:types

      - name: Run test static analysis
        run: composer test:types:pest

      - name: Check Rector rules
        run: composer test:rector && composer test:rector:pest

      - name: Check Filament code quality
        run: composer test:filament

      - name: Build assets
        run: npm run build

      - name: Check asset budgets
        run: npm run test:assets

      - name: Check frontend formatting
        run: npm run format:check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke and accessibility checks
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failures-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run non-browser tests in parallel
        run: vendor/bin/pest --parallel --exclude-testsuite Browser

      - name: Run browser tests serially
        run: vendor/bin/pest --testsuite Browser
